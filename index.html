<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DINI BUSANA - AR Experience</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        body { 
            font-family: 'Plus+Jakarta+Sans', sans-serif; 
            background-color: #0f172a; 
            overscroll-behavior-y: contain;
        }
        model-viewer {
            width: 100%;
            height: 50vh; 
            background: radial-gradient(circle, #1e293b 0%, #0f172a 100%);
            --poster-color: transparent;
        }
        .btn-ar-glow {
            animation: pulse-border 2s infinite;
        }
        @keyframes pulse-border {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        .active-size { 
            background-color: #10b981 !important; 
            color: #0f172a !important; 
            border-color: #10b981 !important;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.6) !important;
            transform: scale(1.05);
        }

        /* Styling Progress Bar UX */
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(16, 185, 129, 0.1);
            border-top: 4px solid #10b981;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* FIX: Class penentu untuk menghilangkan loading screen otomatis */
        .hide {
            display: none !important;
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body class="text-slate-200 pb-32">

    <div class="min-h-screen flex flex-col">
        
        <header class="p-5 flex justify-between items-center bg-slate-900/50 backdrop-blur-md sticky top-0 z-50">
            <div>
                <h1 class="text-lg font-bold text-white tracking-tight">DINI BUSANA <span class="text-emerald-400">AR</span></h1>
                <p class="text-[10px] text-slate-400 uppercase tracking-widest">Digitalisasi UMKM Modern</p>
            </div>
            <div class="w-8 h-8 rounded-full bg-emerald-500/20 flex items-center justify-center">
                <div class="w-2 h-2 bg-emerald-400 rounded-full animate-pulse"></div>
            </div>
        </header>

        <section class="relative flex-none">
            <model-viewer 
                id="main-viewer"
                src="assets/models/male_formal_outfit.glb"
                ar 
                ar-modes="webxr scene-viewer quick-look" 
                camera-controls 
                touch-action="pan-y"
                shadow-intensity="2" 
                exposure="1"
                environment-image="neutral"
                auto-rotate
                ar-placement="floor">
                
                <div slot="progress-bar" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-900 z-50 transition-opacity duration-300">
                    <div class="loading-spinner mb-4"></div>
                    <p class="text-emerald-400 text-xs font-bold animate-pulse tracking-widest uppercase">Menyiapkan 3D...</p>
                </div>

                <button slot="ar-button" class="absolute bottom-6 left-1/2 -translate-x-1/2 bg-white text-slate-900 px-6 py-3 rounded-full font-bold shadow-2xl flex items-center gap-2 btn-ar-glow z-10 transition-transform active:scale-95">
                    <svg class="w-5 h-5 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path></svg>
                    LIHAT DI KAMERA
                </button>
            </model-viewer>
        </section>

        <section class="px-5 -mt-2">
            <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest block mb-3">Pilih Koleksi Baju</label>
            <div class="overflow-x-auto no-scrollbar flex gap-4 pb-2" id="model-nav">
                </div>
        </section>

        <main class="px-6 mt-8 space-y-8">
            <header>
                <h2 id="model-name" class="text-2xl font-bold text-white">Kemeja Formal Pria</h2>
                <p id="model-desc" class="text-slate-400 text-sm mt-1">Solusi digitalisasi untuk UMKM penjahit rumahan mandiri.</p>
            </header>

            <div class="space-y-3">
                <label class="text-xs font-semibold text-slate-500 uppercase tracking-widest">Material & Warna Kain</label>
                <div class="flex gap-4 overflow-x-auto pb-2 no-scrollbar" id="color-palette">
                    <button onclick="updateColor('#ffffff', this)" class="shrink-0 w-10 h-10 rounded-full border-2 border-white/20 bg-white ring-2 ring-emerald-500 ring-offset-2 ring-offset-slate-900 scale-110 transition-all"></button>
                    <button onclick="updateColor('#1e293b', this)" class="shrink-0 w-10 h-10 rounded-full border-2 border-white/20 bg-slate-800 transition-all"></button>
                    <button onclick="updateColor('#7f1d1d', this)" class="shrink-0 w-10 h-10 rounded-full border-2 border-white/20 bg-red-900 transition-all"></button>
                    <button onclick="updateColor('#14532d', this)" class="shrink-0 w-10 h-10 rounded-full border-2 border-white/20 bg-green-900 transition-all"></button>
                    <button onclick="updateColor('#1e3a8a', this)" class="shrink-0 w-10 h-10 rounded-full border-2 border-white/20 bg-blue-900 transition-all"></button>
                    <button onclick="updateColor('#ca8a04', this)" class="shrink-0 w-10 h-10 rounded-full border-2 border-white/20 bg-yellow-600 transition-all"></button>
                </div>
            </div>

            <div class="space-y-3">
                <label class="text-xs font-semibold text-slate-500 uppercase tracking-widest">Pilih Ukuran (Size)</label>
                <div class="grid grid-cols-4 gap-3">
                    <button onclick="updateSize('S', 0, this)" class="size-btn py-3 rounded-xl border border-slate-700 font-bold active-size transition-all">S</button>
                    <button onclick="updateSize('M', 10000, this)" class="size-btn py-3 rounded-xl border border-slate-700 font-bold transition-all hover:bg-slate-800">M</button>
                    <button onclick="updateSize('L', 20000, this)" class="size-btn py-3 rounded-xl border border-slate-700 font-bold transition-all hover:bg-slate-800">L</button>
                    <button onclick="updateSize('XL', 35000, this)" class="size-btn py-3 rounded-xl border border-slate-700 font-bold transition-all hover:bg-slate-800">XL</button>
                </div>
            </div>
        </main>

        <div class="fixed bottom-0 left-0 w-full bg-slate-900/95 backdrop-blur-xl border-t border-slate-800 p-5 flex items-center justify-between gap-4 z-50">
            <div>
                <span class="text-[10px] text-slate-500 uppercase">Estimasi Biaya</span>
                <p id="price-tag" class="text-xl font-bold text-emerald-400">Rp 150.000</p>
            </div>
            <button class="flex-1 bg-emerald-500 text-slate-900 font-bold py-3 rounded-xl shadow-[0_0_20px_rgba(16,185,129,0.3)] active:scale-95 transition-all">
                Pesan via WA
            </button>
        </div>
    </div>

    <script>
        const wardrobe = [
            { id: 'formal', name: 'Kemeja Formal', file: 'male_formal_outfit.glb', price: 150000, desc: 'Digitalisasi pesanan untuk penjahit rumahan.' },
            { id: 'batik', name: 'Batik Pendek', file: '2_men_batik_shirt_short.glb', price: 175000, desc: 'Inovasi produk melalui diferensiasi layanan.' },
            { id: 'dress', name: 'Evening Dress', file: 'dress.glb', price: 280000, desc: 'Peningkatan kualitas layanan dengan visual 3D.' },
            { id: 'hoodie', name: 'Casual Hoodie', file: 'hoodie.glb', price: 135000, desc: 'Manajemen pesanan digital yang lebih rapi.' },
            { id: 'blouse', name: 'Simple Blouse', file: 'simple_blouse.glb', price: 120000, desc: 'Pemanfaatan teknologi untuk bersaing dengan kompetitor.' }
        ];

        let selectedModel = wardrobe[0];
        let extraCost = 0;
        const viewer = document.querySelector('#main-viewer');

        const nav = document.getElementById('model-nav');
        wardrobe.forEach((item, index) => {
            const btn = document.createElement('button');
            btn.className = `w-20 h-20 rounded-2xl border-2 shrink-0 overflow-hidden bg-slate-800 transition-all ${index === 0 ? 'border-emerald-500 scale-105 shadow-[0_0_15px_rgba(16,185,129,0.3)]' : 'border-slate-700'}`;
            btn.innerHTML = `<div class="h-full w-full flex items-center justify-center text-[10px] p-2 text-center font-bold leading-tight">${item.name}</div>`;
            btn.onclick = () => {
                selectedModel = item;
                viewer.src = `assets/models/${item.file}`;
                document.getElementById('model-name').innerText = item.name;
                document.getElementById('model-desc').innerText = item.desc;
                
                document.querySelectorAll('#model-nav button').forEach(b => {
                    b.classList.remove('border-emerald-500', 'scale-105', 'shadow-[0_0_15px_rgba(16,185,129,0.3)]');
                    b.classList.add('border-slate-700');
                });
                btn.classList.add('border-emerald-500', 'scale-105', 'shadow-[0_0_15px_rgba(16,185,129,0.3)]');
                btn.classList.remove('border-slate-700');
                refreshPrice();
            };
            nav.appendChild(btn);
        });

        function updateColor(color, el) {
            if (!viewer.model || !viewer.model.materials) return;
            const material = viewer.model.materials[0];
            if(material) material.pbrMetallicRoughness.setBaseColorFactor(color);

            document.querySelectorAll('#color-palette button').forEach(b => b.classList.remove('ring-2', 'ring-emerald-500', 'ring-offset-2', 'ring-offset-slate-900', 'scale-110'));
            el.classList.add('ring-2', 'ring-emerald-500', 'ring-offset-2', 'ring-offset-slate-900', 'scale-110');
        }

        function updateSize(size, extra, el) {
            extraCost = extra;
            const scale = { 'S': '0.9 0.9 0.9', 'M': '1 1 1', 'L': '1.1 1.1 1.1', 'XL': '1.2 1.2 1.2' };
            viewer.scale = scale[size];

            document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active-size'));
            el.classList.add('active-size');
            refreshPrice();
        }

        function refreshPrice() {
            const total = selectedModel.price + extraCost;
            document.getElementById('price-tag').innerText = `Rp ${total.toLocaleString('id-ID')}`;
        }
    </script>
</body>
</html>
